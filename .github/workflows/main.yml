name: gujarat-post-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Deployment Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_USER }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
            echo "SSH deployment secrets configured."
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "::warning::SSH deployment secrets (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY) are incomplete or not configured in repository secrets."
          fi

      - name: Install SSH keys
        if: steps.check_secrets.outputs.has_ssh == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          install -m 600 -D /dev/null ~/.ssh/id_rsa
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT="${{ secrets.SSH_PORT || '1186' }}"
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Connect SSH and deploy Backend and Frontend
        if: steps.check_secrets.outputs.has_ssh == 'true'
        run: |
          SSH_PORT="${{ secrets.SSH_PORT || '1186' }}"

          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /var/app/Gujarat-Post-Website

            echo "---------- Pulling Latest Code ----------"
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main

            echo "========== BACKEND DEPLOYMENT =========="

            cd /var/app/Gujarat-Post-Website/backend

            echo "---------- Installing Backend Dependencies ----------"
            npm install

            echo "---------- Building Backend ----------"
            npm run build

            echo "---------- Restarting Backend ----------"
            pm2 restart gujarat-post-backend --update-env > /dev/null 2>&1

            echo "========== BACKEND DEPLOYMENT SUCCESSFUL =========="

            echo "========== FRONTEND DEPLOYMENT =========="

            cd /var/app/Gujarat-Post-Website/frontend

            echo "---------- Installing Frontend Dependencies ----------"
            npm install

            echo "---------- Building Frontend ----------"
            npm run build

            echo "---------- Restarting Frontend ----------"
            pm2 restart gujarat-post-frontend --update-env > /dev/null 2>&1

            echo "========== DEPLOYMENT SUCCESSFUL - DevOps Team =========="

          EOF

      - name: Build Verification (Fallback when SSH secrets not set)
        if: steps.check_secrets.outputs.has_ssh != 'true'
        run: |
          echo "Running build validation for backend and frontend..."
          cd backend
          npm install --no-audit --no-fund
          npm run build
          cd ../frontend
          npm install --no-audit --no-fund
          npm run build
          echo "Build validation completed successfully!"

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.ssh
