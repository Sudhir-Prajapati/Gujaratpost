name: Build Android Artifacts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      # 1. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPost-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 2. Setup Signing Keystore from GitHub Secrets if available
      - name: Decode Release Keystore
        id: setup_signing
        if: ${{ env.SIGNING_KEY_STORE_BASE64 != '' && env.SIGNING_KEY_ALIAS != '' }}
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          echo "Decoding release keystore into runner temp..."
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> $GITHUB_OUTPUT

      # 3. Build Signed Release APK
      - name: Build Signed Release APK
        if: ${{ steps.setup_signing.outputs.keystore_path != '' }}
        env:
          RELEASE_STORE_FILE: ${{ steps.setup_signing.outputs.keystore_path }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: ${{ steps.setup_signing.outputs.keystore_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPost-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 4. Build Signed Release AAB
      - name: Build Signed Release AAB
        if: ${{ steps.setup_signing.outputs.keystore_path != '' }}
        env:
          RELEASE_STORE_FILE: ${{ steps.setup_signing.outputs.keystore_path }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB Bundle
        if: ${{ steps.setup_signing.outputs.keystore_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GujaratPost-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # 5. Clean up temporary keystore file
      - name: Cleanup Keystore
        if: always() && steps.setup_signing.outputs.keystore_path != ''
        run: |
          rm -f "${{ steps.setup_signing.outputs.keystore_path }}"
